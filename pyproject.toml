[project]
name = "agents-lab"
version = "0.1.0"
description = "Temporal + OpenAI Agents SDK sandbox lab (zip inspect)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai-agents>=0.19.2,<0.20",
  "openai>=1.99.0",
  "temporalio[openai-agents]>=1.31.0,<2",
  "python-dotenv>=1.0.0",
  "opentelemetry-api>=1.44.0",
  "opentelemetry-sdk>=1.44.0",
]

[project.scripts]
agents-lab = "agents_lab.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agents_lab"]

[tool.uv]
package = true
